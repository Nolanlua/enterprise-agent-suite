[project]
name = "enterprise-agent-suite"
version = "0.1.0"
description = "Enterprise data platform, evaluation platform and two production-oriented agents"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/common",
  "platforms/data-platform",
  "platforms/eval-platform",
  "apps/tcm-knowledge-agent",
  "apps/retail-ordering-agent",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "platforms", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
testpaths = ["platforms", "apps"]
pythonpath = ["."]
addopts = "-q"
