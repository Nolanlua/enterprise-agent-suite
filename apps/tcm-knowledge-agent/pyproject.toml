[project]
name = "tcm-knowledge-agent"
version = "0.1.0"
description = "TCM knowledge base agent with hybrid retrieval, graph expansion and safety guardrails"
requires-python = ">=3.12"
dependencies = [
  "agent-common",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "langgraph>=0.6,<2",
  "langchain-core>=0.3,<2",
  "redis>=5.0,<7",
  "prometheus-client>=0.20,<1",
  "structlog>=24.1,<26",
]

[tool.uv.sources]
agent-common = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
