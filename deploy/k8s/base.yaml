apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-config
  namespace: agent-platform
data:
  APP_ENV: "prod"
  DATA_PLATFORM_URL: "http://data-platform:8001"
  EVAL_PLATFORM_URL: "http://eval-platform:8002"
  ORDER_SERVICE_URL: "http://order-service:8020"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-platform
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: data-platform}
  template:
    metadata:
      labels: {app: data-platform}
    spec:
      containers:
        - name: api
          image: registry.example.com/agent-platform/data-platform:1.0.0
          ports: [{containerPort: 8001}]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
          readinessProbe:
            httpGet: {path: /readyz, port: 8001}
          livenessProbe:
            httpGet: {path: /healthz, port: 8001}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: data-platform
  namespace: agent-platform
spec:
  selector: {app: data-platform}
  ports: [{port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-platform
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: eval-platform}
  template:
    metadata:
      labels: {app: eval-platform}
    spec:
      containers:
        - name: api
          image: registry.example.com/agent-platform/eval-platform:1.0.0
          ports: [{containerPort: 8002}]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: 8002}
---
apiVersion: v1
kind: Service
metadata:
  name: eval-platform
  namespace: agent-platform
spec:
  selector: {app: eval-platform}
  ports: [{port: 8002, targetPort: 8002}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcm-agent
  namespace: agent-platform
spec:
  replicas: 3
  selector:
    matchLabels: {app: tcm-agent}
  template:
    metadata:
      labels: {app: tcm-agent}
    spec:
      containers:
        - name: api
          image: registry.example.com/agent-platform/tcm-agent:1.0.0
          ports: [{containerPort: 8011}]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: tcm-agent
  namespace: agent-platform
spec:
  selector: {app: tcm-agent}
  ports: [{port: 8011, targetPort: 8011}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-agent
  namespace: agent-platform
spec:
  replicas: 3
  selector:
    matchLabels: {app: retail-agent}
  template:
    metadata:
      labels: {app: retail-agent}
    spec:
      containers:
        - name: api
          image: registry.example.com/agent-platform/retail-agent:1.0.0
          ports: [{containerPort: 8012}]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: retail-agent
  namespace: agent-platform
spec:
  selector: {app: retail-agent}
  ports: [{port: 8012, targetPort: 8012}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      containers:
        - name: api
          image: registry.example.com/agent-platform/order-service:1.0.0
          ports: [{containerPort: 8020}]
          envFrom:
            - configMapRef: {name: agent-platform-config}
            - secretRef: {name: agent-platform-secrets}
